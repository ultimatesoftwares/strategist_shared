syntax = "proto3";

package fleet.v1;

option go_package = "github.com/ultimatesoftwares/fleet/gen/fleet/v1;fleetv1";
option csharp_namespace = "Fleet.V1";
option java_package = "com.ultimatesoftwares.fleet.v1";
option java_multiple_files = true;
option java_outer_classname = "EngineProto";

import "fleet/v1/common.proto";
import "fleet/v1/terminal.proto";

// EngineGateway is implemented by the ENGINE; the hub is the client.
//
// The hub dials the engine's gRPC server (Fleet:EngineAddress) and keeps a
// single Link stream open — the hub itself exposes no engine-facing port.
// Over that stream the hub introduces itself (HubHello), pushes the raw
// terminal event feed (one TerminalStatus snapshot per connected terminal
// first, then live events) and answers engine requests. The hub owns
// command_id assignment, deadline stamping, result correlation and session
// lifecycle; it does not interpret trading semantics. Reconnection with
// exponential backoff is the hub's job; after a reconnect the engine
// receives a fresh HubHello and snapshots.
service EngineGateway {
  rpc Link(stream HubMessage) returns (stream EngineMessage);
}

// HubMessage: hub -> engine.
message HubMessage {
  oneof msg {
    // First message on every (re)connect.
    HubHello hello = 1;
    // Terminal traffic: ticks, trade events, heartbeats, command results,
    // logs, depth, plus hub-generated TerminalStatus transitions. Delivery
    // is two-lane: high-rate market data (tick_batch, market_depth,
    // heartbeat) is dropped oldest-first when the engine reads slowly, so
    // terminal sessions are never stalled; everything else (trade events,
    // statuses, command results, logs, hello) is queued losslessly for the
    // life of the link. Ordering is preserved within each lane, not across
    // lanes.
    EngineEvent event = 2;
    // Answer to an EngineMessage.request, matched by request_id.
    EngineResponse response = 3;
  }
}

// EngineMessage: engine -> hub.
message EngineMessage {
  oneof msg {
    EngineRequest request = 1;
  }
}

message HubHello {
  string hub_version = 1;
  int64 connected_at_unix_ms = 2;
}

// EngineRequest is answered with exactly one EngineResponse carrying the
// same request_id. Requests may be pipelined; responses can arrive out of
// order (Execute can take seconds while ListTerminals answers instantly).
message EngineRequest {
  // Unique per in-flight request; echoed back verbatim.
  string request_id = 1;
  oneof request {
    ListTerminalsRequest list_terminals = 2;
    Execute execute = 3;
  }
}

message EngineResponse {
  string request_id = 1;
  oneof response {
    ListTerminalsResponse list_terminals = 2;
    ExecuteResult execute = 3;
    // The request could not be relayed (unknown terminal, invalid
    // payload, ...). Command-level failures (rejected order, bad symbol)
    // come back as a normal ExecuteResult whose CommandResult has ok=false.
    RequestError error = 4;
  }
}

// RequestError mirrors gRPC status codes (3 = INVALID_ARGUMENT,
// 5 = NOT_FOUND, 14 = UNAVAILABLE, ...).
message RequestError {
  int32 code = 1;
  string message = 2;
}

message ListTerminalsRequest {}

message ListTerminalsResponse {
  repeated TerminalStatus terminals = 1;
}

// TerminalStatus is the hub's view of one terminal session.
message TerminalStatus {
  string terminal_id = 1;
  // True while the session stream is up. A `false` status on the event
  // feed marks a disconnect.
  bool connected = 2;
  Platform platform = 3;
  string terminal_build = 4;
  string connector_version = 5;
  int64 account_login = 6;
  string broker_server = 7;
  int32 server_tz_offset_minutes = 8;
  // Hub-assigned session id (matches Welcome.session_id) for log
  // correlation.
  string session_id = 9;
  int64 connected_at_unix_ms = 10;
  // Time of the last event received on the session (any kind).
  int64 last_event_unix_ms = 11;
  // Last heartbeat snapshot; zero values until the first heartbeat.
  double equity = 12;
  double balance = 13;
  bool terminal_connected = 14;  // terminal <-> broker link state
  int32 open_positions = 15;
  int32 pending_orders = 16;
}

// Execute relays one command to one terminal and resolves with the
// terminal's CommandResult.
//
// The hub assigns command_id when the embedded command has none, stamps
// deadline_unix_ms from timeout_ms, and answers with a synthetic
// ERROR_CODE_TIMEOUT / ERROR_CODE_CONNECTION_LOST result when the terminal
// cannot reply. `welcome` payloads are rejected (RequestError
// INVALID_ARGUMENT); `ping` is fire-and-forget and resolves immediately
// with an empty ok result. Unknown terminal_id resolves with RequestError
// NOT_FOUND.
message Execute {
  string terminal_id = 1;
  // How long the hub waits for the terminal's CommandResult. The embedded
  // command's deadline_unix_ms is derived from this. 0 = hub default.
  int64 timeout_ms = 2;
  // The command to relay. command_id may be left empty (the hub assigns
  // one); when set it must be unique and is echoed back verbatim.
  TerminalCommand command = 3;
}

message ExecuteResult {
  CommandResult result = 1;
}

// EngineEvent is one item on the hub's event feed.
message EngineEvent {
  string terminal_id = 1;
  // Hub receive/emit time.
  int64 time_unix_ms = 2;
  oneof event {
    // Raw passthrough of a connector message (ticks, heartbeats, trade
    // events, command results, logs, market depth, hello).
    TerminalEvent terminal_event = 10;
    // Hub-generated session state transition or snapshot.
    TerminalStatus terminal_status = 11;
  }
}
