syntax = "proto3";

package fleet.v1;

option go_package = "github.com/ultimatesoftwares/fleet/gen/fleet/v1;fleetv1";
option csharp_namespace = "Fleet.V1";
option java_package = "com.ultimatesoftwares.fleet.v1";
option java_multiple_files = true;
option java_outer_classname = "CommonProto";

// Shared messages used by both the client-facing and terminal-facing services.

// Platform identifies which MetaTrader generation a terminal runs.
enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_MT4 = 1;
  PLATFORM_MT5 = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_BUY = 1;
  ORDER_TYPE_SELL = 2;
  ORDER_TYPE_BUY_LIMIT = 3;
  ORDER_TYPE_SELL_LIMIT = 4;
  ORDER_TYPE_BUY_STOP = 5;
  ORDER_TYPE_SELL_STOP = 6;
  // MT5 only; MT4 terminals never produce or accept these.
  ORDER_TYPE_BUY_STOP_LIMIT = 7;
  ORDER_TYPE_SELL_STOP_LIMIT = 8;
}

enum Timeframe {
  TIMEFRAME_UNSPECIFIED = 0;
  TIMEFRAME_M1 = 1;
  TIMEFRAME_M5 = 2;
  TIMEFRAME_M15 = 3;
  TIMEFRAME_M30 = 4;
  TIMEFRAME_H1 = 5;
  TIMEFRAME_H4 = 6;
  TIMEFRAME_D1 = 7;
  TIMEFRAME_W1 = 8;
  TIMEFRAME_MN1 = 9;
}

// ErrorCode is a platform-neutral classification of trade/server failures.
// The raw MT4 GetLastError() / MT5 trade retcode travels alongside it in
// Error.platform_code so nothing is lost in translation.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INTERNAL = 1;          // unexpected failure inside the connector
  ERROR_CODE_UNSUPPORTED = 2;       // command not supported on this platform
  ERROR_CODE_INVALID_REQUEST = 3;   // malformed or missing fields
  ERROR_CODE_NOT_FOUND = 4;         // unknown ticket/symbol
  ERROR_CODE_TRADE_DISABLED = 5;    // trading disabled (terminal, EA or server side)
  ERROR_CODE_MARKET_CLOSED = 6;
  ERROR_CODE_NOT_ENOUGH_MONEY = 7;
  ERROR_CODE_INVALID_PRICE = 8;     // bad price / off quotes
  ERROR_CODE_INVALID_STOPS = 9;     // SL/TP violates stop level or freeze level
  ERROR_CODE_INVALID_VOLUME = 10;   // lot size out of range or bad step
  ERROR_CODE_REQUOTE = 11;
  ERROR_CODE_PRICE_CHANGED = 12;
  ERROR_CODE_TIMEOUT = 13;          // command deadline exceeded
  ERROR_CODE_TOO_MANY_REQUESTS = 14;
  ERROR_CODE_REJECTED = 15;         // rejected by broker for another reason
  ERROR_CODE_CONNECTION_LOST = 16;  // terminal lost connection to the trade server
  ERROR_CODE_DUPLICATE = 17;        // duplicate client_order_id / replayed command
}

// Error is the structured failure detail attached to command results.
message Error {
  ErrorCode code = 1;
  // Raw platform code: MT4 GetLastError() or MT5 MqlTradeResult.retcode.
  int32 platform_code = 2;
  // Human-readable description, primarily for logs; do not branch on it.
  string message = 3;
  // True when the same command may safely be retried by the caller.
  bool retryable = 4;
}

message Tick {
  string symbol = 1;
  double bid = 2;
  double ask = 3;
  double last = 4;
  uint64 volume = 5;
  int64 time_unix_ms = 6;
  // Current spread in points as reported by the terminal at tick time
  // (MT5 SYMBOL_SPREAD / MT4 MODE_SPREAD). 0 = unknown.
  int32 spread_points = 7;
}

message AccountInfo {
  int64 login = 1;
  string broker_server = 2;
  string broker_company = 3;
  string currency = 4;
  double balance = 5;
  double equity = 6;
  double margin = 7;
  double margin_free = 8;
  double margin_level = 9;  // percent; 0 when no margin is used
  int32 leverage = 10;
  bool trade_allowed = 11;  // trading enabled for this account
  string account_name = 12;
  // Account funding environment as the venue itself reports it: "live",
  // "demo", "paper" or "contest". "" = the venue/EA didn't say (older EA
  // builds, data-only venues).
  string environment = 13;
}

// AccountSnapshot is the lightweight per-message account state attached to
// streaming data (see TickBatch.account). Equity and margin_free move with
// every tick while positions are open; balance/margin change on trades only.
message AccountSnapshot {
  double balance = 1;
  double equity = 2;
  double margin = 3;
  double margin_free = 4;
}

// SymbolInfo carries the contract specification a client needs to size and
// validate orders without round-tripping to the terminal for every trade.
message SymbolInfo {
  string symbol = 1;
  string description = 2;
  int32 digits = 3;
  double point = 4;
  double tick_size = 5;
  double tick_value = 6;        // in the account currency
  double contract_size = 7;
  double volume_min = 8;
  double volume_max = 9;
  double volume_step = 10;
  int32 stops_level_points = 11;  // minimal SL/TP distance in points
  int32 freeze_level_points = 12;
  double margin_required = 13;    // margin for 1 lot, account currency
  string currency_base = 14;
  string currency_profit = 15;
  string currency_margin = 16;
  bool trade_allowed = 17;
  int64 spread_points = 18;       // current spread; 0 if floating/unknown
}

// Bar is one OHLC candle; time_unix_ms is the bar's open time.
message Bar {
  int64 time_unix_ms = 1;
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
  uint64 tick_volume = 6;
  uint64 real_volume = 7;  // MT5 only; 0 on MT4
  int32 spread = 8;        // MT5 only; 0 on MT4
}

// Position is an open position on the account.
// On MT4 (hedging-only) every market order is a position; on MT5 this maps to
// the position object, with `ticket` being the position ticket.
message Position {
  uint64 ticket = 1;
  string symbol = 2;
  OrderType type = 3;         // ORDER_TYPE_BUY or ORDER_TYPE_SELL
  double volume = 4;
  double price_open = 5;
  double price_current = 6;
  double stop_loss = 7;       // 0 = not set
  double take_profit = 8;     // 0 = not set
  double profit = 9;          // floating P/L in the account currency
  double swap = 10;
  double commission = 11;     // 0 when the broker does not report it per-position
  string comment = 12;
  int64 magic_number = 13;    // EA magic; 0 = manual/unknown
  int64 open_time_unix_ms = 14;
}

// PendingOrder is a working order that has not been filled yet.
message PendingOrder {
  uint64 ticket = 1;
  string symbol = 2;
  OrderType type = 3;         // limit/stop types
  double volume_initial = 4;
  double volume_current = 5;  // remaining after partial fills
  double price = 6;           // requested entry price
  double price_current = 7;   // current market price
  double stop_limit_price = 8;  // MT5 stop-limit orders only; otherwise 0
  double stop_loss = 9;       // 0 = not set
  double take_profit = 10;    // 0 = not set
  string comment = 11;
  int64 magic_number = 12;    // EA magic; 0 = manual/unknown
  int64 setup_time_unix_ms = 13;
  int64 expiration_unix_ms = 14;  // 0 = good till cancelled
}

// Deal is a historical account transaction (fill, balance operation, ...).
enum DealEntry {
  DEAL_ENTRY_UNSPECIFIED = 0;
  DEAL_ENTRY_OPEN = 1;
  DEAL_ENTRY_CLOSE = 2;
  DEAL_ENTRY_REVERSE = 3;
  DEAL_ENTRY_CLOSE_BY = 4;
}

message Deal {
  uint64 ticket = 1;
  uint64 order_ticket = 2;     // order that produced this deal; 0 for balance ops
  uint64 position_ticket = 3;  // position affected; 0 for balance ops
  string symbol = 4;
  OrderType type = 5;
  double volume = 6;
  double price = 7;
  double profit = 8;
  double swap = 9;
  double commission = 10;
  string comment = 11;
  int64 magic_number = 12;
  int64 time_unix_ms = 13;
  DealEntry entry = 14;       // unspecified for older connectors
  optional double fee = 15;   // MT5 DEAL_FEE; absent on older connectors
}

// BookSide labels one side of the order book.
enum BookSide {
  BOOK_SIDE_UNSPECIFIED = 0;
  BOOK_SIDE_SELL = 1;  // ask side
  BOOK_SIDE_BUY = 2;   // bid side
}

// BookEntry is one price level of the depth of market.
message BookEntry {
  BookSide side = 1;
  double price = 2;
  // Lots at this level; the fractional MT5 volume_real when the broker
  // provides it, else the integer tick volume.
  double volume = 3;
}

// MarketDepth is a full order-book snapshot for one symbol, pushed on every
// book change while a depth subscription is active (MT5 only; MT4 has no
// depth API). Entries come exactly as the terminal reports them: sorted by
// price descending — sell (ask) levels first, then buy (bid) levels.
message MarketDepth {
  string symbol = 1;
  int64 time_unix_ms = 2;
  repeated BookEntry entries = 3;
}
