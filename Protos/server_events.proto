// Server → GUI push feeds for the Strategist desktop client (replaces
// SSE/polling): engine state (snapshot on connect, then live updates as the
// EngineStateBroker receives them from the engine's gRPC state stream),
// live quotes (the fleet quote plane fanned out per watched instrument),
// and live order books (the hub's depth plane, same pattern).
syntax = "proto3";

package serverevents;

option csharp_namespace = "Strategist.ServerEvents";

service EngineStateFeed {
  // Replays the latest state per subject, then streams live updates.
  rpc Subscribe (EngineStateSubscribeRequest) returns (stream EngineStateUpdate);
}

message EngineStateSubscribeRequest {
  // Optional subject prefix filter (e.g. "health.strategy."); empty = all.
  string prefix = 1;
}

message EngineStateUpdate {
  string subject = 1;
  // Payload JSON — same shape as api/engine/state entries' data.
  string json = 2;
  // Server receive time (unix milliseconds) — drives staleness checks.
  int64 received_at_ms = 3;
}

// Live bid/ask fan-out of the fleet quote plane: the server consumes the
// hub's FlatBuffers quote exchange on demand (one upstream subscription per
// watched venue/instrument, shared across GUI subscribers) and streams the
// ticks down. Quotes-only — orders/account state ride the engine state feed.
service QuoteFeed {
  // Streams live quotes for the selected instruments until the client
  // disconnects. Changing the watched set = reopen the stream. A slow
  // consumer sees the newest ticks (older ones are dropped), never a stall.
  rpc Subscribe (QuoteSubscribeRequest) returns (stream QuoteUpdate);
}

message QuoteSelector {
  string venue_id = 1;    // fleet venue id (e.g. "mt5-a")
  string instrument_id = 2;  // canonical instrument id (quote routing key half)
}

message QuoteSubscribeRequest {
  // 1..128 selectors; duplicates are collapsed.
  repeated QuoteSelector instruments = 1;
}

message QuoteUpdate {
  string venue_id = 1;
  string instrument_id = 2;
  double bid = 3;
  double ask = 4;
  // Tick timestamp (unix milliseconds) as stamped on the quote plane.
  int64 ts_ms = 5;
}

// Live order-book fan-out of the fleet depth plane: the server consumes the
// hub's protobuf MarketDepth exchange on demand (one upstream subscription
// per watched venue/instrument, shared across GUI subscribers) and streams
// full book snapshots down. MT5 venues only — other venues publish no depth.
service DepthFeed {
  // Streams book snapshots for the selected instruments until the client
  // disconnects. Changing the watched set = reopen the stream. A slow
  // consumer sees the newest books (older ones are dropped), never a stall.
  rpc Subscribe (DepthSubscribeRequest) returns (stream DepthUpdate);
}

message DepthSubscribeRequest {
  // 1..128 selectors; duplicates are collapsed.
  repeated QuoteSelector instruments = 1;
}

// Mirrors fleet.v1.BookSide (the depth plane's wire enum).
enum DepthSide {
  DEPTH_SIDE_UNSPECIFIED = 0;
  DEPTH_SIDE_SELL = 1;  // ask side
  DEPTH_SIDE_BUY = 2;   // bid side
}

message DepthLevel {
  DepthSide side = 1;
  double price = 2;
  // Lots at this level (fractional when the broker provides volume_real).
  double volume = 3;
}

message DepthUpdate {
  string venue_id = 1;
  string instrument_id = 2;
  // The FULL book, exactly as the terminal reports it: sell (ask) levels
  // first, then buy (bid) levels, price descending. Each update replaces
  // the previous book entirely.
  repeated DepthLevel levels = 3;
  // Snapshot timestamp (unix milliseconds) as stamped on the depth plane.
  int64 ts_ms = 4;
}
