syntax = "proto3";

package fleet.v1;

option go_package = "github.com/ultimatesoftwares/fleet/gen/fleet/v1;fleetv1";
option csharp_namespace = "Fleet.V1";
option java_package = "com.ultimatesoftwares.fleet.v1";
option java_multiple_files = true;
option java_outer_classname = "EngineProto";

import "fleet/v1/common.proto";
import "fleet/v1/terminal.proto";

// EngineService is the engine-facing API of the Fleet hub.
//
// The hub is a thin relay: engines inspect the connected MetaTrader
// terminals, push TerminalCommand payloads at them, and consume the raw
// TerminalEvent feed. The hub owns command_id assignment, result
// correlation, deadlines and session lifecycle; it does not interpret
// trading semantics.
//
// The service listens on a local endpoint only. Reachability of that
// endpoint is the trust boundary (same model as TerminalService).
service EngineService {
  // ListTerminals returns the currently connected terminals and their
  // last-known health snapshot.
  rpc ListTerminals(ListTerminalsRequest) returns (ListTerminalsResponse);

  // Execute relays one command to one terminal and resolves with the
  // terminal's CommandResult.
  //
  // The hub assigns command_id when the embedded command has none, stamps
  // deadline_unix_ms from timeout_ms, and answers with a synthetic
  // ERROR_CODE_TIMEOUT / ERROR_CODE_CONNECTION_LOST result when the
  // terminal cannot reply. `welcome` payloads are rejected
  // (INVALID_ARGUMENT); `ping` is fire-and-forget and resolves
  // immediately with an empty ok result. Unknown terminal_id resolves
  // with gRPC NOT_FOUND.
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);

  // Subscribe streams terminal traffic to the engine: every TerminalEvent
  // received from matching terminals (ticks, trade events, heartbeats,
  // command results, logs, depth) plus hub-generated TerminalStatus
  // transitions (connect/disconnect). On subscription start the hub emits
  // one TerminalStatus snapshot per currently connected terminal.
  //
  // The per-subscriber buffer is bounded; a slow engine drops the oldest
  // events rather than stalling terminal sessions.
  rpc Subscribe(SubscribeRequest) returns (stream EngineEvent);
}

message ListTerminalsRequest {}

message ListTerminalsResponse {
  repeated TerminalStatus terminals = 1;
}

// TerminalStatus is the hub's view of one terminal session.
message TerminalStatus {
  string terminal_id = 1;
  // True while the session stream is up. A `false` status on the
  // Subscribe feed marks a disconnect.
  bool connected = 2;
  Platform platform = 3;
  string terminal_build = 4;
  string connector_version = 5;
  int64 account_login = 6;
  string broker_server = 7;
  int32 server_tz_offset_minutes = 8;
  // Hub-assigned session id (matches Welcome.session_id) for log
  // correlation.
  string session_id = 9;
  int64 connected_at_unix_ms = 10;
  // Time of the last event received on the session (any kind).
  int64 last_event_unix_ms = 11;
  // Last heartbeat snapshot; zero values until the first heartbeat.
  double equity = 12;
  double balance = 13;
  bool terminal_connected = 14;  // terminal <-> broker link state
  int32 open_positions = 15;
  int32 pending_orders = 16;
}

message ExecuteRequest {
  string terminal_id = 1;
  // How long the hub waits for the terminal's CommandResult. The embedded
  // command's deadline_unix_ms is derived from this. 0 = hub default.
  int64 timeout_ms = 2;
  // The command to relay. command_id may be left empty (the hub assigns
  // one); when set it must be unique and is echoed back verbatim.
  TerminalCommand command = 3;
}

message ExecuteResponse {
  CommandResult result = 1;
}

message SubscribeRequest {
  // Terminals to watch. Empty = all terminals, including ones that
  // connect after the subscription started.
  repeated string terminal_ids = 1;
}

// EngineEvent is one item on the Subscribe feed.
message EngineEvent {
  string terminal_id = 1;
  // Hub receive/emit time.
  int64 time_unix_ms = 2;
  oneof event {
    // Raw passthrough of a connector message (ticks, heartbeats, trade
    // events, command results, logs, market depth, hello).
    TerminalEvent terminal_event = 10;
    // Hub-generated session state transition or snapshot.
    TerminalStatus terminal_status = 11;
  }
}
