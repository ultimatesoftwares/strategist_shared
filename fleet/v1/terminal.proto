syntax = "proto3";

package fleet.v1;

option go_package = "github.com/ultimatesoftwares/fleet/gen/fleet/v1;fleetv1";
option csharp_namespace = "Fleet.V1";
option java_package = "com.ultimatesoftwares.fleet.v1";
option java_multiple_files = true;
option java_outer_classname = "TerminalProto";

import "fleet/v1/common.proto";

// TerminalService is the internal-facing service that MetaTrader connectors
// (the Fleet EA + bridge DLL running inside the terminal) connect to.
//
// Connectors dial OUT to the hub and hold a single long-lived bidirectional
// stream: the hub sends commands down, the connector sends events (ticks,
// command results, trade events, heartbeats) up.
//
// Session contract:
//   1. The first TerminalEvent MUST be `hello`. The hub answers with a
//      TerminalCommand whose payload is `welcome` (or closes the stream with
//      a gRPC status: ALREADY_EXISTS for a duplicate terminal_id,
//      FAILED_PRECONDITION for a platform mismatch). An unknown terminal_id
//      is NOT an error: the hub self-registers the terminal from the Hello
//      fields (terminal-first onboarding; the connector self-assigns a
//      stable id and reachability of the internal listener is the trust
//      boundary).
//   2. After `welcome`, both sides may send freely. The connector MUST send
//      `heartbeat` at least every `Welcome.heartbeat_interval_ms`; the hub
//      treats a missed interval x3 as a dead session.
//   3. Every TerminalCommand with a non-empty command_id MUST eventually be
//      answered with exactly one CommandResult carrying the same command_id,
//      even on failure or timeout.
//   4. Reconnects start a brand-new session (new Hello). The hub is the
//      source of truth for desired subscriptions and re-issues them after
//      the handshake; connectors keep no cross-session state. The hub also
//      downloads the terminal's full symbol catalog (get_symbol_info with no
//      filter) after every handshake and persists it for instrument mapping.
//
// The same service serves MT4 and MT5; `Hello.platform` tells the hub which
// dialect the connector speaks, and the hub rejects commands the platform
// cannot execute with ERROR_CODE_UNSUPPORTED.
service TerminalService {
  rpc Session(stream TerminalEvent) returns (stream TerminalCommand);
}

// TerminalEvent flows connector -> hub.
message TerminalEvent {
  // Stable identifier of the terminal, assigned at provisioning time.
  // Set on every message so the hub can route/validate cheaply.
  string terminal_id = 1;

  // Monotonically increasing per-session sequence number, starting at 1.
  // Lets the hub detect gaps/reordering in connector pipelines and dedupe
  // after internal retries.
  uint64 sequence = 2;

  // Connector-side send time; used to measure clock drift and one-way latency.
  int64 sent_at_unix_ms = 3;

  oneof event {
    Hello hello = 10;  // must be the first message on the stream
    Heartbeat heartbeat = 11;
    TickBatch tick_batch = 12;
    CommandResult command_result = 13;
    TradeEvent trade_event = 14;
    AccountEvent account_event = 15;
    LogEvent log_event = 16;
    MarketDepth market_depth = 17;
  }
}

// TerminalCommand flows hub -> connector.
message TerminalCommand {
  // Correlates CommandResult back to the originating client request.
  // Empty only for fire-and-forget payloads (welcome, ping).
  string command_id = 1;

  // Absolute deadline. If the connector cannot complete the command by this
  // time it MUST reply with ERROR_CODE_TIMEOUT instead of acting late.
  // 0 = no deadline.
  int64 deadline_unix_ms = 2;

  oneof command {
    Welcome welcome = 9;
    SubscribeSymbols subscribe_symbols = 10;
    UnsubscribeSymbols unsubscribe_symbols = 11;
    PlaceOrder place_order = 12;
    ClosePosition close_position = 13;
    GetAccountInfo get_account_info = 14;
    GetHistory get_history = 15;
    GetPositions get_positions = 16;
    GetPendingOrders get_pending_orders = 17;
    ModifyPosition modify_position = 18;
    CancelOrder cancel_order = 19;
    ModifyOrder modify_order = 20;
    GetSymbolInfo get_symbol_info = 21;
    GetDealsHistory get_deals_history = 22;
    Ping ping = 23;
    ClosePositionsBatch close_positions_batch = 24;
    SubscribeDepth subscribe_depth = 25;
    UnsubscribeDepth unsubscribe_depth = 26;
  }
}

// Hello registers the connector with the hub. The session is identified
// solely by TerminalEvent.terminal_id; there is no application-level
// authentication (run the hub on a trusted network, or add transport-level
// security such as TLS/mTLS if exposure requires it).
message Hello {
  reserved 1;
  reserved "auth_token";
  Platform platform = 2;
  string terminal_build = 3;  // platform build number (e.g. MT5 build 4620)
  string connector_version = 4;  // Fleet EA/bridge semantic version
  int64 account_login = 5;
  string broker_server = 6;
  // Minutes east of UTC for the broker/server time, so the hub can translate
  // bar times without guessing (e.g. 120 for UTC+2).
  int32 server_tz_offset_minutes = 7;
}

// Welcome is the hub's handshake acknowledgement. It is the first command on
// a healthy stream and carries session-scoped settings.
message Welcome {
  string session_id = 1;            // unique per connection, for log correlation
  int64 heartbeat_interval_ms = 2;  // how often the connector must heartbeat
  // Server wall clock at send time; connectors use it to estimate drift.
  int64 server_time_unix_ms = 3;
  // Maximum ticks the connector should pack into a single TickBatch.
  int32 max_tick_batch_size = 4;
}

message Heartbeat {
  int64 unix_ms = 1;
  // Snapshot of cheap health metrics so the hub can monitor without polling.
  bool terminal_connected = 2;  // terminal <-> broker link state
  double equity = 3;
  double balance = 4;
  int32 pending_orders = 6;
  // Full open-position snapshot; Position.profit carries the floating PnL,
  // so the hub mirrors exposure passively without polling get_positions.
  repeated Position positions = 7;

  // Was `int32 open_positions`, superseded by the full `positions` list.
  reserved 5;
  reserved "open_positions";
}

// Ping requests an immediate Heartbeat (liveness probe outside the normal
// heartbeat cadence). No CommandResult is sent for a ping.
message Ping {
  int64 unix_ms = 1;
}

// TickBatch carries 1..N ticks. Connectors MAY group ticks produced close
// together to cut per-message overhead, or send one per message for minimum
// latency (the Fleet bridge does the latter). Order is chronological.
message TickBatch {
  repeated Tick ticks = 1;
  // Account state sampled when this message was sent, so consumers get
  // tick-resolution equity/margin without reconstructing it from positions.
  AccountSnapshot account = 2;
}

message SubscribeSymbols {
  repeated string symbols = 1;
}

message UnsubscribeSymbols {
  repeated string symbols = 1;
}

// SubscribeDepth starts market-depth (DOM) streaming for the symbols: the
// connector opens the terminal's order book (MT5 MarketBookAdd) and pushes a
// MarketDepth snapshot on every book change, zero-latency like ticks.
// MT4 has no depth API and answers ERROR_CODE_UNSUPPORTED.
message SubscribeDepth {
  repeated string symbols = 1;
}

message UnsubscribeDepth {
  repeated string symbols = 1;
}

message PlaceOrder {
  // Caller-supplied idempotency key. Connectors MUST track recently executed
  // ids and answer replays with ERROR_CODE_DUPLICATE instead of re-trading.
  string client_order_id = 1;
  string symbol = 2;
  OrderType type = 3;
  double volume = 4;
  double price = 5;             // 0 for market orders
  double stop_limit_price = 6;  // MT5 stop-limit orders only
  double stop_loss = 7;         // 0 = none
  double take_profit = 8;       // 0 = none
  // Max slippage for market orders, in points. 0 = connector default.
  int32 deviation_points = 9;
  int64 magic_number = 10;
  string comment = 11;
  int64 expiration_unix_ms = 12;  // pending orders only; 0 = GTC
}

// ClosePosition closes an open position by sending the opposite deal.
message ClosePosition {
  uint64 ticket = 1;
  double volume = 2;  // 0 = close fully; less than the position = partial
  int32 deviation_points = 3;  // max slippage in points; 0 = connector default
}

// ClosePositionsBatch fully closes multiple open positions in one command.
// Targets: the explicit `tickets` list, or — when it is empty — every open
// position matching the symbol/magic filters (all empty = close everything).
// The connector attempts every target independently and answers with a
// BatchCloseResult carrying one entry per target; the CommandResult is
// ok=true whenever the batch was executed, even if individual closes failed.
message ClosePositionsBatch {
  repeated uint64 tickets = 1;
  string symbol = 2;           // filter when tickets is empty
  int64 magic_number = 3;      // filter when tickets is empty; 0 = all
  int32 deviation_points = 4;  // max slippage in points; 0 = connector default
}

message GetAccountInfo {}

message GetPositions {
  // Optional filters; zero values mean "no filter".
  string symbol = 1;
  int64 magic_number = 2;
}

message GetPendingOrders {
  string symbol = 1;
  int64 magic_number = 2;
}

// ModifyPosition updates a position's stop loss / take profit.
// Semantics: a negative value leaves the level unchanged, 0 clears it,
// a positive value sets it.
message ModifyPosition {
  uint64 ticket = 1;
  double stop_loss = 2;
  double take_profit = 3;
}

// ModifyOrder updates a pending order in place.
// Same set/clear/keep semantics as ModifyPosition for SL/TP; price 0 keeps
// the current entry price.
message ModifyOrder {
  uint64 ticket = 1;
  double price = 2;
  double stop_limit_price = 3;
  double stop_loss = 4;
  double take_profit = 5;
  int64 expiration_unix_ms = 6;  // -1 keep, 0 = GTC, >0 new expiry
}

// CancelOrder removes a pending (not yet filled) order.
message CancelOrder {
  uint64 ticket = 1;
}

message GetSymbolInfo {
  repeated string symbols = 1;  // empty = all symbols visible in Market Watch
}

// GetHistory fetches OHLC bars. If count > 0, the most recent `count` bars
// ending at to_unix_ms (or now when 0) are returned; otherwise the range
// [from_unix_ms, to_unix_ms].
message GetHistory {
  string symbol = 1;
  Timeframe timeframe = 2;
  int64 from_unix_ms = 3;
  int64 to_unix_ms = 4;
  int32 count = 5;
}

// GetDealsHistory fetches closed deals in [from_unix_ms, to_unix_ms].
message GetDealsHistory {
  int64 from_unix_ms = 1;
  int64 to_unix_ms = 2;  // 0 = now
  string symbol = 3;     // optional filter
  int64 magic_number = 4;  // optional filter; 0 = all
}

message CommandResult {
  string command_id = 1;
  bool ok = 2;
  Error error = 3;  // set when ok == false
  oneof payload {
    OrderResult order_result = 10;
    AccountInfo account_info = 11;
    HistoryResult history_result = 12;
    PositionsResult positions_result = 13;
    PendingOrdersResult pending_orders_result = 14;
    SymbolInfoResult symbol_info_result = 15;
    DealsResult deals_result = 16;
    BatchCloseResult batch_close_result = 17;
  }
}

message HistoryResult {
  repeated Bar bars = 1;
}

message PositionsResult {
  repeated Position positions = 1;
}

message PendingOrdersResult {
  repeated PendingOrder orders = 1;
}

message SymbolInfoResult {
  repeated SymbolInfo symbols = 1;
}

message DealsResult {
  repeated Deal deals = 1;
}

// Per-position outcome of a ClosePositionsBatch.
message CloseResult {
  uint64 ticket = 1;
  bool ok = 2;
  double closed_volume = 3;  // set when ok
  double close_price = 4;    // set when ok
  Error error = 5;           // set when ok == false
}

message BatchCloseResult {
  repeated CloseResult results = 1;
}

message OrderResult {
  uint64 order_ticket = 1;
  uint64 position_ticket = 2;  // MT5: resulting/affected position; MT4: = order_ticket
  double executed_price = 3;
  double executed_volume = 4;
  string client_order_id = 5;  // echoed back from PlaceOrder
}

// TradeEvent is pushed by the connector whenever the account's trade state
// changes (fills, SL/TP hits, manual trades in the terminal, expirations),
// so the hub mirrors state without polling.
message TradeEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_POSITION_OPENED = 1;
    KIND_POSITION_CLOSED = 2;
    KIND_POSITION_MODIFIED = 3;
    KIND_ORDER_PLACED = 4;
    KIND_ORDER_MODIFIED = 5;
    KIND_ORDER_CANCELLED = 6;
    KIND_ORDER_FILLED = 7;
    KIND_ORDER_EXPIRED = 8;
  }
  Kind kind = 1;
  int64 time_unix_ms = 2;
  oneof subject {
    Position position = 10;  // position-related kinds
    PendingOrder order = 11; // order-related kinds
  }
  Deal deal = 12;  // set for fills/closes when the platform reports one
}

// AccountEvent is a periodic or change-driven snapshot of account metrics.
message AccountEvent {
  AccountInfo account = 1;
}

// LogEvent forwards noteworthy connector-side diagnostics to the hub.
message LogEvent {
  enum Level {
    LEVEL_UNSPECIFIED = 0;
    LEVEL_DEBUG = 1;
    LEVEL_INFO = 2;
    LEVEL_WARN = 3;
    LEVEL_ERROR = 4;
  }
  Level level = 1;
  string message = 2;
  int64 time_unix_ms = 3;
}
