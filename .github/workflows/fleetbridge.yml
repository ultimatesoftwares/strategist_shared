name: FleetBridge DLLs

# Builds the NativeAOT MT4/MT5 connector DLLs on Windows (NativeAOT cannot
# cross-compile from Linux) and gates them on:
#   0. StateTests - SharedState/Outbound unit tests (plain JIT, Linux)
#   1. AbiCheck   - all 34 undecorated Fleet_* exports + lifecycle contract
#   2. FixSmoke   - QuickFIX/n logon round-trip compiled with the same AOT
#                   settings as the DLL
# Artifacts: FleetBridge-win-x64 (MT5), FleetBridge-win-x86 (MT4).
# On main, both DLLs are also published to GHCR as a scratch image
# (ghcr.io/<owner>/fleetbridge) that the terminals Dockerfile pulls from —
# raw workflow artifacts expire and need API auth, an OCI image does not.

on:
  push:
    branches: [main]
    paths:
      - "FleetBridge/**"
      - ".github/workflows/fleetbridge.yml"
  pull_request:
    paths:
      - "FleetBridge/**"
      - ".github/workflows/fleetbridge.yml"
  workflow_dispatch:

jobs:
  state-tests:
    # Fast fail: pure state-machine tests need no Windows runner or AOT.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: "Gate 0: SharedState/Outbound unit tests"
        run: dotnet run -c Release --project FleetBridge/tools/StateTests/StateTests.csproj

  build:
    needs: state-tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-x86]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # win-x86 NativeAOT requires .NET 9+; the projects target net10.0.
          dotnet-version: 10.0.x

      - name: Publish FleetBridge.dll (NativeAOT, ${{ matrix.rid }})
        run: >
          dotnet publish FleetBridge/FleetBridge.csproj
          -c Release -r ${{ matrix.rid }}
          -o out/bridge

      - name: Publish AbiCheck (${{ matrix.rid }})
        run: >
          dotnet publish FleetBridge/tools/AbiCheck/AbiCheck.csproj
          -c Release -r ${{ matrix.rid }} --self-contained
          -o out/abicheck

      - name: "Gate 1: ABI check"
        run: out/abicheck/AbiCheck.exe out/bridge/FleetBridge.dll

      - name: Publish FixSmoke (NativeAOT, ${{ matrix.rid }})
        run: >
          dotnet publish FleetBridge/tools/FixSmoke/FixSmoke.csproj
          -c Release -r ${{ matrix.rid }}
          -o out/fixsmoke

      - name: "Gate 2: QuickFIX/n under NativeAOT"
        run: out/fixsmoke/FixSmoke.exe

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: FleetBridge-${{ matrix.rid }}
          path: |
            out/bridge/FleetBridge.dll
            out/bridge/FleetBridge.pdb
          if-no-files-found: error

  publish:
    # Pack both DLLs into a minimal GHCR image so Dockerfiles can
    # `COPY --from=ghcr.io/<owner>/fleetbridge:<tag> /win-x64/FleetBridge.dll ...`.
    # Pin the commit tag for reproducible terminal builds; :latest tracks main.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the DLL image
        run: |
          cat > Dockerfile.fleetbridge <<'EOF'
          FROM scratch
          COPY dist/FleetBridge-win-x64/ /win-x64/
          COPY dist/FleetBridge-win-x86/ /win-x86/
          EOF
          image=ghcr.io/${{ github.repository_owner }}/fleetbridge
          docker build -f Dockerfile.fleetbridge \
            -t "$image:latest" -t "$image:${{ github.sha }}" .
          docker push --all-tags "$image"
